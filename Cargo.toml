[package]
name = "reader-rust"
version = "1.4.3"
edition = "2021"
description = "Simple Happy — 阅读 + 直播 + 音乐 + RSS 一体化桌面客户端的本地核心"

# The desktop app is a workspace member so it shares this target/ directory, but
# `default-members` keeps bare `cargo build` / `cargo test` (and the Dockerfile)
# building the server only. Build the desktop app with `-p reader-desktop`.
[workspace]
members = ["desktop/src-tauri"]
default-members = ["."]

[dependencies]
tauri = { version = "2" }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate", "blocking", "cookies"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
thiserror = "1"
anyhow = "1"
aes = "0.8"
bytes = "1"
cbc = "0.1"
des = "0.8"
ecb = "0.1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
cookie_store = "0.22"
flate2 = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
scraper = "0.20"
jsonpath_lib = "0.3"
regex = "1"
rquickjs = { version = "0.7", features = ["futures"] }
http = "1"
urlencoding = "2"
serde_urlencoded = "0.7"
futures = "0.3"
rand = "0.8"
once_cell = "1"
# 直播弹幕: B 站/斗鱼都是 WebSocket 长连接。
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
feed-rs = "1"
base64 = "0.22"
# 本地音乐导入: 读取 mp3/flac/m4a 等标签与时长。
lofty = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"
sxd-xpath = "0.4"
sxd-document = "0.3"
quick-xml = "0.31"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
# PDF 解析/提取。lopdf 不单独依赖: 用 pdf-extract 重导出的那份, 避免
# 两个 lopdf 版本各自算一套页序。
pdf-extract = "0.12.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
# 斗鱼弹幕服务器(danmuproxy.douyu.com:8506)只支持旧 TLS 套件,
# rustls 直接握手失败; Windows 上改用 Schannel(native-tls)连斗鱼。
native-tls = "0.2"
tokio-native-tls = "0.3"

[dev-dependencies]
# Only used by tests/*.rs to spin up local mock upstream sites. The app itself
# is pure IPC — no HTTP server.
axum = { version = "0.7", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }

# pdf-extract 上游 0.12.0 遇到无 ToUnicode 的 GBK-EUC-H 等 Type0 编码会直接
# panic (LaTeX CJK 产物常见)。vendor 副本加了 GBK/Big5 系 CMap 的近似解码:
# 恒等字节映射 + encoding_rs 逐码位解码当伪 ToUnicode 表。
#
# tao 0.35.3 在 Windows 上有一个「最大化后进无边框全屏会露出任务栏高度的黑边」
# 的 bug: WM_NCCALCSIZE 把最大化窗口的客户区钳到显示器工作区(rcWork), 而窗口
# 本身已是整屏尺寸。上游 tauri-apps/tao#1353 已修复(2026-09-30 合并), 但**尚未
# 随任何 release 发布**(最新 release tao-v0.37.1 早于该合并)。vendor 副本只改了
# 那一行 —— 见 src/platform_impl/windows/event_loop.rs 的 VENDOR PATCH 注释。
# 补丁存在期间前端不需要 unmaximize 变通, 退出全屏因此没有两段动画。
# 上游发布含修复的版本后, 删除 vendor/tao 与本条目即可。
[patch.crates-io]
pdf-extract = { path = "vendor/pdf-extract" }
tao = { path = "vendor/tao" }
