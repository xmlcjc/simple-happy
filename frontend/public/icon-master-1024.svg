<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="brand-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9A06A" />
      <stop offset="0.55" stop-color="#D07B3F" />
      <stop offset="1" stop-color="#B45F28" />
    </linearGradient>
    <linearGradient id="brand-play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D98246" />
      <stop offset="1" stop-color="#B0591F" />
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#brand-bg)" />

  <!-- 摊开的书：左页（阅读） -->
  <path
    d="M496 800 C 416 752 312 730 196 740 L196 250 C 312 240 416 262 496 310 Z"
    fill="#FFFFFF"
  />
  <!-- 摊开的书：右页（直播） -->
  <path
    d="M528 800 C 608 752 712 730 828 740 L828 250 C 712 240 608 262 528 310 Z"
    fill="#FFFFFF"
  />

  <!-- 左页文字行 -->
  <g stroke="#CC7436" stroke-width="24" stroke-linecap="round" opacity="0.85">
    <path d="M258 392 H 430" />
    <path d="M258 490 H 430" />
    <path d="M258 588 H 384" />
  </g>

  <!-- 右页播放键 -->
  <path d="M626 380 L 626 620 L 806 500 Z" fill="url(#brand-play)" />
</svg>
